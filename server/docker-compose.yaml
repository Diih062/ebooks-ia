version: "3.8"

services:
  app:
    build: ./server
    container_name: backend-ebook
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: db-ebook
    environment:
      POSTGRES_DB: leads
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis-ebook
    ports:
      - "6379:6379"

  worker:
    build: ./server
    command: ["node", "worker.js"]
    depends_on:
      - redis
      - db
    env_file:
      - ./server/.env
    restart: unless-stopped

volumes:
  pgdata:
