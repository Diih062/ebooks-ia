name: Daily Postgres Backup

on:
  schedule:
    - cron: '0 2 * * *'    # 02:00 UTC todos os dias
  workflow_dispatch:       # permite rodar manualmente

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install PostgreSQL client
      run: sudo apt-get update && sudo apt-get install -y postgresql-client

    - name: Prepare DB env
      run: |
        python - <<'PY'
import os, urllib.parse as up
url = os.environ['DATABASE_URL']
p = up.urlparse(url)
user = p.username
password = p.password
host = p.hostname
port = p.port or 5432
db = p.path.lstrip('/')
print(f"PGUSER={user}")
open('pg_env.sh','w').write(f"export PGPASSWORD='{password}'; export PGHOST='{host}'; export PGPORT='{port}'; export PGUSER='{user}'; export PGDATABASE='{db}';\n")
PY
    - name: Run pg_dump
      run: |
        source pg_env.sh
        mkdir -p backups
        TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
        pg_dump --format=custom --blobs --verbose -f backups/backup-${TIMESTAMP}.dump
    - name: Upload backup artifact
      uses: actions/upload-artifact@v4
      with:
        name: pg-backup-${{ github.run_id }}
        path: backups/

